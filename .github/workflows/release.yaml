name: create a new release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build native image (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            ext: ""
            src: result/bin/sfenv
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            ext: ""
            src: result/bin/sfenv
          - os: macos
            arch: aarch64
            runner: macos-latest
            ext: ""
            src: result/bin/sfenv
          - os: windows
            arch: x86_64
            runner: windows-latest
            ext: ".exe"
            src: out/nativeLink.dest/out.exe
    steps:
      - uses: actions/checkout@v7

      - name: install nix
        if: matrix.os != 'windows'
        uses: cachix/install-nix-action@v31.11.1

      - name: build libfyaml (windows)
        if: matrix.os == 'windows'
        run: |
          git clone --depth 1 --branch v0.9.6 https://github.com/pantoniou/libfyaml.git
          cmake -S libfyaml -B libfyaml/build -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build libfyaml/build --config Release

      - name: set up jdk (windows)
        if: matrix.os == 'windows'
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: install mill (windows)
        if: matrix.os == 'windows'
        run: curl -L https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.7/mill-dist-1.1.7-mill.bat -o mill.bat

      - name: build (linux/macos)
        if: matrix.os != 'windows'
        run: nix build .#

      - name: build (windows)
        if: matrix.os == 'windows'
        env:
          # @link("fyaml") in YamlParser.scala makes Scala Native inject -lfyaml
          # unconditionally.  lld-link resolves -lfyaml as fyaml.lib by searching
          # the library path, so add the build output directory as a search path.
          LIBFYAML_LIBS: "-L${{ github.workspace }}/libfyaml/build/Release"
        run: .\mill.bat --no-server nativeLink

      - name: stage binary
        shell: bash
        run: cp ${{ matrix.src }} sfenv-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

      - name: upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: sfenv-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
