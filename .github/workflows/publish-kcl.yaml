name: publish KCL package

# Publishes the sfenv KCL package (kcl/) to GHCR. Package releases are versioned independently of the
# application and use kcl/vX.Y.Z tags, which do not trigger the application release (release.yaml).
# A manual run (workflow_dispatch) only compiles the package.

on:
  push:
    tags:
      - "kcl/v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kcl
    steps:
      - uses: actions/checkout@v7

      - name: install kcl
        run: wget -q https://kcl-lang.io/script/install-cli.sh -O - | /bin/bash

      - name: check kcl.mod version matches tag
        if: startsWith(github.ref, 'refs/tags/kcl/v')
        run: |
          mod_version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' kcl.mod)
          tag_version="${GITHUB_REF_NAME#kcl/}"
          [ "v${mod_version}" = "${tag_version}" ] || { echo "kcl.mod version ${mod_version} != tag ${GITHUB_REF_NAME}"; exit 1; }

      - name: compile
        run: kcl run core.k && kcl run rules.k

      - name: log in to GHCR
        if: startsWith(github.ref, 'refs/tags/kcl/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | kcl registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: push
        if: startsWith(github.ref, 'refs/tags/kcl/v')
        run: kcl mod push "oci://ghcr.io/${GITHUB_REPOSITORY,,}"
